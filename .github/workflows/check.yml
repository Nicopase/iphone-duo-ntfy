# Put this file at .github/workflows/check.yml in your repo.
# Each run checks Apple once a minute for ~5 hours 40 minutes. GitHub tries to start a
# run every 5 minutes; if one is already going, the next waits and takes over
# as soon as it ends, so checking continues even when GitHub skips schedules.
# Keep the repo PUBLIC: public repos get unlimited free Actions minutes.
name: Duo stock check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a fake [TEST] in-stock alert"
        type: boolean
        default: false

# One scheduled checker at a time; manual runs get their own lane so they
# start right away instead of waiting behind a long check.
concurrency:
  group: duo-stock-check-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # Remember what was already in stock (and when the last hourly
      # "still checking" message went out) between runs.
      - uses: actions/cache@v4
        with:
          path: .tracker_state.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: tracker-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi

      - name: Check Apple Store pickup (every minute for ~5h40m)
        if: ${{ github.event_name == 'schedule' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STOP_AFTER_MINUTES: "340"
        run: python3 duo_tracker.py check 100000 60

      - name: Quick check (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 duo_tracker.py check

      - name: Test in-stock alert (real check, pretends first store has stock)
        if: ${{ inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FAKE_IN_STOCK: "1"
        run: python3 duo_tracker.py check
