# Put this file at .github/workflows/check.yml in your repo.
# Each run checks Apple about once a minute for up to ~5h40m. When a run ends
# (time limit, or Apple keeps blocking that server), it starts the next run
# itself, which usually lands on a different server. The schedule below is
# just a backup in case the chain ever breaks.
# To STOP everything: Actions → Duo stock check → ⋯ → Disable workflow.
# Keep the repo PUBLIC: public repos get unlimited free Actions minutes.
name: Duo stock check

on:
  schedule:
    - cron: "17 * * * *"     # backup: once an hour
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a fake [TEST] in-stock alert"
        type: boolean
        default: false

# Only one long checker at a time (scheduled or started by hand). Test alerts
# get their own lane so they start right away.
concurrency:
  group: ${{ inputs.test_alert && 'duo-test-alert' || 'duo-stock-check' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets a finished run start the next one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # Remember what was already in stock (and when the last hourly
      # "still checking" message went out) between runs.
      - uses: actions/cache@v4
        with:
          path: .tracker_state.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: tracker-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi

      - name: Check Apple Store pickup (about every minute, up to ~5h40m)
        if: ${{ !inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STOP_AFTER_MINUTES: "340"
          MAX_BLOCKED_IN_ROW: "3"
        run: python3 duo_tracker.py check 100000 60

      - name: Test in-stock alert (real check, pretends first store has stock)
        if: ${{ inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FAKE_IN_STOCK: "1"
        run: python3 duo_tracker.py check

      # Start the next run. Skipped if you cancel the run yourself.
      - name: Start next run
        if: ${{ !cancelled() && !inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref "${{ github.ref_name }}"
