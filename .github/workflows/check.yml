# Put this file at .github/workflows/check.yml in your repo.
# GitHub starts this about every 5 minutes; each run checks Apple 4 times,
# 1 minute apart, so you get roughly once-a-minute coverage.
# Keep the repo PUBLIC: public repos get unlimited free Actions minutes.
name: Duo stock check

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay runs a few minutes at busy times
  workflow_dispatch: {}      # lets you tap "Run workflow" manually

# Never run two checks at once.
concurrency:
  group: duo-stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # Remember what was already in stock so you don't get re-alerted every run.
      - uses: actions/cache@v4
        with:
          path: .tracker_state.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: tracker-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi

      - name: Check Apple Store pickup (4 times, 1 minute apart)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 duo_tracker.py check 4 60
