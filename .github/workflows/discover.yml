# Put this at .github/workflows/discover.yml
# Actions tab → "Find Duo part numbers" → Run workflow, then open the run log.
name: Find Duo part numbers

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python3 duo_tracker.py discover
